name: trace

# Golden tests for Trace's log parser (public/trace/parser.js). No browser, no deploy.
on:
  push:
    paths:
      - "public/trace/**"
      - "test/trace/**"
      - "test/*.log"
      - ".github/workflows/trace.yml"
  pull_request:
    paths:
      - "public/trace/**"
      - "test/trace/**"
      - "test/*.log"
      - ".github/workflows/trace.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Parser golden tests
        run: node --test test/trace/*.test.mjs
